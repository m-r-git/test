<!DOCTYPE html>
<html>
<head>
  <title>Add Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    a.button {
      display: inline-block;
      padding: 16px 32px;
      background: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Add Contact</h1>
  <p>Tap the button to add this contact to your phone.</p>
  <a id="addBtn" class="button" href="contact.vcf">Add Contact</a>

<script>
  const ua = navigator.userAgent;
  const btn = document.getElementById("addBtn");

  if (/android/i.test(ua)) {
    btn.href = "intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name=Test%20Person;S.phone=%2B1234567890;S.email=test@example.com;end";
  } else if (/iphone|ipad|ipod/i.test(ua)) {
    window.location.href = "contact.vcf";
  }
</script>
</body>
</html>
